plugins {
    id 'fabric-loom' version '1.14.10'
    id 'org.jetbrains.kotlin.jvm' version '2.2.21'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

def legacy121Versions = [
        '1.21.1', '1.21.2', '1.21.3', '1.21.4',
        '1.21.5', '1.21.6', '1.21.7', '1.21.8'
]
def minecraftVersion = project.minecraft_version.toString()
def javaVersion = 21
def versionSourceSet = legacy121Versions.contains(minecraftVersion) ? 'legacy121' : 'modern121'

base {
    archivesName = "${project.archives_base_name}-fabric-mc${minecraftVersion}"
}

sourceSets {
    main {
        java.srcDir 'src/versions/common121/java'
        java.srcDir "src/versions/${versionSourceSet}/java"
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation include("computer.iroh:iroh:${project.iroh_version}")
    implementation include("org.jetbrains.kotlin:kotlin-stdlib:${project.kotlin_version}")
    implementation include("org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:${project.kotlin_coroutines_version}")
    implementation include("net.java.dev.jna:jna:${project.jna_version}")
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", minecraftVersion
    inputs.property "java_version", javaVersion

    filesMatching("fabric.mod.json") {
        expand(
                "version": project.version,
                "minecraft_version": minecraftVersion,
                "java_version": javaVersion
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
